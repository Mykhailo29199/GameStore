@if (readonly()) {
  <span class="stars" aria-hidden="true">
    @for (star of stars; track star) {
      <span class="star" [class.star--on]="star <= value()"></span>
    }
  </span>
  <span class="visually-hidden">{{
    'rating.value' | t: { label: (label() | t), value: value() }
  }}</span>
} @else {
  <fieldset class="stars stars--input">
    <legend class="visually-hidden">{{ label() | t }}</legend>
    @for (star of stars; track star) {
      <button
        class="star star--button"
        type="button"
        [class.star--on]="star <= value()"
        [attr.aria-label]="'rating.star' | t: { value: star }"
        [attr.aria-pressed]="star <= value()"
        (click)="select(star)"
      ></button>
    }
  </fieldset>
}
