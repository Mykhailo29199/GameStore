<section class="container">
  <form
    class="auth"
    novalidate
    (submit)="$event.preventDefault(); submit(login.value, password.value, confirmation.value)"
  >
    <h2 class="page-title">
      {{ (registering() ? 'auth.createAccountTitle' : 'auth.logInTitle') | t }}
    </h2>

    <label class="field">
      <span>{{ 'auth.login' | t }}</span>
      <input #login class="field__control" type="text" name="login" autocomplete="username" />
    </label>
    <label class="field">
      <span>{{ 'auth.password' | t }}</span>
      <input
        #password
        class="field__control"
        type="password"
        name="password"
        [autocomplete]="registering() ? 'new-password' : 'current-password'"
      />
    </label>
    <label class="field" [hidden]="!registering()">
      <span>{{ 'auth.repeatPassword' | t }}</span>
      <input
        #confirmation
        class="field__control"
        type="password"
        name="confirmation"
        autocomplete="new-password"
      />
    </label>

    @if (error()) {
      <p class="form-error" role="alert">{{ error() }}</p>
    }

    <div class="auth__actions">
      @if (registering()) {
        <a class="link" routerLink="/login" queryParamsHandling="preserve">
          {{ 'auth.haveAccount' | t }}
        </a>
      } @else {
        <a class="link" routerLink="/register" queryParamsHandling="preserve">
          {{ 'auth.createAccount' | t }}
        </a>
      }
      <button class="btn" type="submit" [disabled]="sending()">
        {{ (registering() ? 'auth.register' : 'auth.logIn') | t }}
      </button>
    </div>
  </form>
</section>
