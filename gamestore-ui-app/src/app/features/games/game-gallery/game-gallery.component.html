<div class="gallery__stage">
  <img class="gallery__image" [src]="current()" [alt]="title()" width="540" height="445" />
  <button
    class="gallery__arrow gallery__arrow--prev"
    type="button"
    aria-label="Previous picture"
    (click)="show(index() - 1)"
  ></button>
  <button
    class="gallery__arrow"
    type="button"
    aria-label="Next picture"
    (click)="show(index() + 1)"
  ></button>
</div>
<ul class="gallery__thumbs">
  @for (image of images(); track image; let position = $index) {
    <li>
      <button
        class="gallery__thumb"
        type="button"
        [class.gallery__thumb--current]="position === index()"
        [attr.aria-label]="'Picture ' + (position + 1)"
        (click)="show(position)"
      >
        <img [src]="image" alt="" width="160" height="115" loading="lazy" />
      </button>
    </li>
  }
</ul>
